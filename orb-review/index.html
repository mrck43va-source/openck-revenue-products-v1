<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session ORB Review V1</title><link rel="stylesheet" href="../styles.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="theme-color" content="#0d1c2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ORB Review"></head><body><div class="wrap"><div class="top"><div class="brand">CKTRADES TOOL V1</div><div class="pill">SESSION REVIEW</div></div><section class="hero"><h1>Session / ORB Review</h1><p>Daily preparation and review checklist for opening-range/session discipline.</p><div class="notice">Checklist scores measure process completion, not probability of profit.</div><div class="grid"><div class="card"><label>Date</label><input id="date" type="date"><label><input class="c" type="checkbox" style="width:auto"> Higher-timeframe bias documented</label><label><input class="c" type="checkbox" style="width:auto"> Asia/London range marked</label><label><input class="c" type="checkbox" style="width:auto"> Opening range defined</label><label><input class="c" type="checkbox" style="width:auto"> Liquidity levels identified</label><label><input class="c" type="checkbox" style="width:auto"> Entry followed written setup</label><label><input class="c" type="checkbox" style="width:auto"> Risk limit respected</label><label><input class="c" type="checkbox" style="width:auto"> Maximum trade count respected</label><label><input class="c" type="checkbox" style="width:auto"> Screenshot/review completed</label><label>Lesson</label><textarea id="lesson">What worked? What failed? What changes tomorrow?</textarea><button onclick="saveReview()">Save review</button></div><div class="card"><div class="metric"><small>Today's score</small><strong id="score">0%</strong></div><div class="metric"><small>7-review average</small><strong id="avg">0%</strong></div><div class="metric"><small>Reviews saved</small><strong id="count">0</strong></div></div></div><div class="card" style="margin-top:16px"><table><thead><tr><th>Date</th><th>Score</th><th>Lesson</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="footer"><a class="btn secondary" href="../">Back to products</a></div></div><script src="./app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')</script></body></html>
